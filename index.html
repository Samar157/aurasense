<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <title>AuraSense - Emotion Detection</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8bbd0, #b2dfdb);
      color: #333;
    }

    .header {
      display: flex;
      align-items: center;
      background-color: #7e57c2;
      color: white;
      padding: 10px 20px;
      position: relative;
      z-index: 100;
    }

    .menu-icon {
      font-size: 0; /* hide text */
      cursor: pointer;
      margin-right: 10px;
      background-color: transparent;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }

    .menu-icon:hover {
      background-color: rgba(255 255 255 / 0.2);
    }

    .menu-icon i {
      font-size: 28px;
      color: white;
    }

    /* Dropdown container */
    .dropdown {
      display: none;
      position: absolute;
      background-color: white;
      color: #333;
      min-width: 260px;
      top: 56px; /* below icon */
      left: 10px; /* aligned left side */
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border-radius: 14px;
      z-index: 101;
      opacity: 0;
      transform: translateY(-20px);
      transition:
        opacity 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      user-select: none;
      overflow: hidden;
    }

    .dropdown.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* User info block on top */
    .dropdown .user-info {
      background: linear-gradient(135deg, #7e57c2, #b39ddb);
      color: white;
      padding: 20px 20px 24px 20px;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-info img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    .user-info .user-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .user-info .user-name {
      font-weight: 700;
      font-size: 18px;
      margin: 0;
    }

    .user-info .user-email {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
    }

    /* Menu links */
    .dropdown a {
      color: #333;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background-color: #f2f2f2;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 70vh;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin: 20px;
      color: #4a148c;
      text-shadow: 2px 2px 4px #ccc;
      font-weight: bold;
    }

    .emotion-result {
      font-size: 34px;
      color: #2e7d32;
      background-color: #e8f5e9;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      margin-top: 10px;
    }

    .input-area {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .text-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    textarea {
      height: 30px;
      width: 250px;
      padding: 4px 40px 4px 8px;
      border-radius: 10px;
      border: 2px solid #5e35b1;
      resize: none;
      background-color: #ffffff;
      font-size: 16px;
    }

    .icon-inside {
      position: absolute;
      right: 5px;
      display: flex;
      gap: 5px;
    }

    .icon-inside button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #5e35b1;
      transition: color 0.3s;
    }

    .icon-inside button:hover {
      color: #4527a0;
    }

    .submit-btn,
    .reset-btn,
    .history-btn {
      background-color: #5e35b1;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .submit-btn::before {
      content: "\2794"; /* ➔ arrow */
      font-size: 20px;
      vertical-align: middle;
    }

    .history-btn::before {
      content: "\1F4D3"; /* 📓 */
      font-size: 20px;
      vertical-align: middle;
    }

    .submit-btn:hover,
    .reset-btn:hover,
    .history-btn:hover {
      background-color: #4527a0;
    }

    .mic-activation {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      z-index: 99;
      display: none;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6);
      }
      70% {
        box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button
      class="menu-icon"
      id="user-menu-button"
      aria-label="Account menu"
      aria-haspopup="true"
      aria-expanded="false"
      title="User account menu"
    >
      <i class="fas fa-user-circle"></i>
    </button>
    <h2>AuraSense</h2>
    <nav id="dropdown-menu" class="dropdown" role="menu" aria-labelledby="user-menu-button">
      <div class="user-info" tabindex="0">
        <img src="G:\IMG20250704123631.jpg" alt="My photo" />
        <div class="user-details">
          <p class="user-name">Abhishek Tiwari</p>
          <p class="user-email">oficialabhishektiwari@gmail.com</p>
        </div>
      </div>
      <a href="#" role="menuitem" tabindex="0">Edit Profile</a>
      <a href="#" role="menuitem" tabindex="0">Account</a>
      <a href="#" role="menuitem" tabindex="0">Privacy</a>
      <a href="#" role="menuitem" tabindex="0">Help</a>
      <a href="#" role="menuitem" tabindex="0">About</a>
      <a href="#" role="menuitem" tabindex="0">Logout</a>
      <a href="#" role="menuitem" tabindex="0">Shutdown</a>
    </nav>
  </div>

  <div class="container">
    <h1>Emotion Detection</h1>
    <div class="emotion-result" id="emotion-result">--</div>
  </div>

  <div class="input-area">
    <button class="reset-btn" onclick="resetText()">Reset</button>

    <div class="text-wrapper">
      <textarea
        id="text"
        name="text"
        placeholder="Type something..."
        onkeypress="checkEnter(event)"
      ></textarea>
      <div class="icon-inside">
        <button onclick="startRecognition()" title="Start Voice Input">🎤</button>
        <button onclick="openCamera()" title="Open Camera">📷</button>
      </div>
    </div>

    <button class="submit-btn" onclick="submitText()" title="Submit"></button>
    <button class="history-btn" onclick="viewHistory()" title="History"></button>
  </div>

  <div class="mic-activation" id="mic-indicator">🎤</div>

  <script>
  const userButton = document.getElementById('user-menu-button');
  const dropdownMenu = document.getElementById('dropdown-menu');
  userButton.addEventListener('click', e=>{
    e.stopPropagation();
    dropdownMenu.classList.toggle('show');
  });
  window.addEventListener('click', e=>{
    if (!dropdownMenu.contains(e.target) && !userButton.contains(e.target)) dropdownMenu.classList.remove('show');
  });

  let history = [];

  function checkEnter(e){ if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submitText(); } }

  async function submitText(){
    const text = document.getElementById('text').value.trim();
    if (!text) return showMessage('Please enter something first!');
    try {
      const res = await fetch('/predict_text',{method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'text_input='+encodeURIComponent(text)});
      const data = await res.json();
      if (data.error) showMessage(data.error);
      else {
        document.getElementById('emotion-result').innerText = data.emotion;
        history.push({type:'Text', input:text, result:data.emotion, time:new Date().toLocaleTimeString()});
      }
    } catch { showMessage('Error processing text'); }
  }

  function resetText(){
    document.getElementById('text').value='';
    document.getElementById('emotion-result').innerText='--';
  }

  function viewHistory(){
    if (!history.length) return showMessage('No history yet.');
    let html='<h3>History</h3><ul>';
    history.forEach(h=> html+=`<li>[${h.time}] ${h.type}: "${h.input}" → ${h.result}</li>`);
    html+='</ul>';
    const w = window.open('','_blank','width=300,height=400');
    w.document.write(html); w.document.close();
  }

  const micBtn = document.querySelector('.icon-inside button:first-child');
  function startRecognition(){
    micBtn.classList.add('listening');
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) { showMessage('Speech not supported'); micBtn.classList.remove('listening'); return; }
    const r = new Rec();
    r.lang='en-US'; r.interimResults=false;
    r.onresult = async e=>{
      micBtn.classList.remove('listening');
      const transcript = e.results[0][0].transcript.trim();
      if (!transcript) return showMessage('No speech detected.');
      try {
        const res = await fetch('/predict_voice',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({voice_text:transcript})});
        const dat = await res.json();
        if (dat.error) showMessage(dat.error);
        else {
          document.getElementById('emotion-result').innerText = dat.emotion;
          history.push({type:'Voice', input:transcript, result:dat.emotion, time:new Date().toLocaleTimeString()});
        }
      } catch { showMessage('Voice error'); }
    };
    r.onerror = ()=>{
      micBtn.classList.remove('listening');
      showMessage('Mic error');
    };
    r.start();
  }

  let camStream;
  function openCamera(){
    navigator.mediaDevices.getUserMedia({video:true})
      .then(s=>{
        camStream = s;
        const overlay = document.createElement('div');
        overlay.id='camOverlay';
        overlay.style='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1000;';
        const video = document.createElement('video'); video.autoplay=true; video.style='border-radius:8px;width:320px;';
        video.srcObject = s;
        overlay.append(video);
        const capBtn = document.createElement('button'); capBtn.innerText='Capture & Predict';
        capBtn.style='margin-top:15px;padding:10px;background:#5e35b1;color:#fff;border:none;border-radius:8px;';
        capBtn.onclick=captureAndPredict;
        const closeBtn = document.createElement('button'); closeBtn.innerText='Close';
        closeBtn.style='margin-top:8px;padding:10px;background:#5e35b1;color:#fff;border:none;border-radius:8px;';
        closeBtn.onclick=()=>{
          s.getTracks().forEach(t=>t.stop());
          overlay.remove();
        };
        overlay.append(capBtn, closeBtn);
        document.body.append(overlay);
      })
      .catch(()=>showMessage('Camera access denied'));
  }

  async function captureAndPredict(){
    const overlay = document.getElementById('camOverlay');
    const video = overlay.querySelector('video');
    const canvas = document.createElement('canvas');
    canvas.width=48; canvas.height=48;
    canvas.getContext('2d').drawImage(video, 0,0,48,48);
    camStream.getTracks().forEach(t=>t.stop());
    overlay.remove();
    const b64 = canvas.toDataURL('image/png');
    try {
      const res = await fetch('/predict_camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_data:b64})});
      const dat = await res.json();
      if (dat.error) showMessage(dat.error);
      else {
        document.getElementById('emotion-result').innerText = dat.emotion;
        history.push({type:'Camera', input:'Captured image', result:dat.emotion, time:new Date().toLocaleTimeString()});
      }
    } catch { showMessage('Camera error'); }
  }

  function showMessage(msg){
    let box = document.getElementById('message-box');
    if (!box){
      box = document.createElement('div');
      box.id='message-box';
      box.style='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#f44336;color:#fff;padding:8px 20px;border-radius:10px;z-index:10000;opacity:1;transition:opacity 0.8s;';
      document.body.append(box);
    }
    box.textContent = msg;
    setTimeout(()=>box.style.opacity='0',2500);
    setTimeout(()=>box.remove(),3300);
  }

  // add keyframes for mic animation
  const s = document.createElement('style');
  s.innerHTML = '@keyframes blink{50%{opacity:0.5}} .listening{animation:blink 0.8s linear infinite;}';
  document.head.append(s);
</script>

</body>
</html>
